<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Grimoire Magique Interactif</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="stars-container">

    </div>

    <audio id="soundPage" src="page.mp3" preload="auto"></audio>

    <audio id="soundWind" src="winter-wind-402331.mp3" preload="auto"></audio>
    <audio id="soundFire" src="fire-33178.mp3" loop preload="auto"></audio>
    <audio id="soundLumiere" src="lightsaber-ignition-6816.mp3"></audio>
    <audio id="soundWriting" src="healing-magic-1-378665.mp3" loop preload="auto"></audio>




    <div class="controls">
       
        <button id="resetBtn" onclick="resetBook()">Réinitialiser</button>
        <button id="themeBtn" onclick="toggleTheme()">Changer d'ambiance</button>
        <button onclick="rainbowParticles()">Particules</button>

        <button onclick="flyPages()">Vent</button>
        <button onclick="toggleFire()">Feu</button>
        <button onclick="toggleLumiere()">Lumière</button>
        <button onclick="startWriting()">Écriture</button>
   
        
 </div>
    
    
  <div class="book-container" id="bookContainer" onclick="toggleBook()">
      
    <div class="book">
         
        <div id="particleOrigin"></div>
        <div id="lumiereOrigin"></div>

        
        <div class="page back-cover"></div>
        <div class="spine"></div>

        <div class="page inner-page p3">
            <div class="page-content">
                <p>...et la magie commence.</p>
            </div>
        </div>
        <div class="page inner-page p2"></div>
        <div class="page inner-page p1"></div>

        <div class="page front-cover">
            <div class="cover-content">
                <h1>Le Grimoire</h1>
                <div class="ornament"></div>
            </div>
        </div>
    </div>
</div>



<script src="script.js"></script>


<style>
:root {
  --bg-radial-center: #d49a9a;
  --bg-radial-edge: #732f2f;
  --book-color: #4a1212;
  --gold: #ffffff;
  --page-color: #ffffff;
  --text-color: #ffffff;
  --star-opacity: 0;
  --library-opacity: 1;
}

body.dark-mode {
  --bg-radial-center: #e0e0e0;
  --bg-radial-edge: #2a2a2a;
  --book-color: #888888;
  --gold: #e0e0e0;
  --page-color: #f2f2f2;
  --text-color: #000000;
  --star-opacity: 4;
  --library-opacity: 0;
}

body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #000;
  font-family: 'Georgia', serif;
  overflow: hidden;
  perspective: 2000px;
}

.library-bg {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle at center, var(--bg-radial-center), var(--bg-radial-edge));
  opacity: var(--library-opacity);
  transition: opacity 1.5s ease;
  z-index: -2;
}

.stars-container {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: -1;
  opacity: var(--star-opacity);
  transition: opacity 2s ease-in-out;
}

body:not(.dark-mode) .stars-container {
  opacity: 0 !important;
}

.stars-layer {
  position: absolute;
  inset: 0;
  background-image:
    radial-gradient(1px 1px at 10px 10px, #fff, transparent), radial-gradient(1px 1px at 50px 80px, #fff, transparent),
    radial-gradient(2px 2px at 120px 30px, #eee, transparent), radial-gradient(2px 2px at 180px 150px, #fff, transparent),
    radial-gradient(1px 1px at 250px 90px, #ddd, transparent), radial-gradient(1px 1px at 300px 200px, #fff, transparent),
    radial-gradient(2px 2px at 400px 150px, #eee, transparent), radial-gradient(1px 1px at 500px 250px, #fff, transparent),
    radial-gradient(2px 2px at 600px 100px, #ddd, transparent), radial-gradient(1px 1px at 700px 300px, #fff, transparent),
    radial-gradient(1px 1px at 800px 50px, #eee, transparent), radial-gradient(2px 2px at 900px 220px, #fff, transparent),
    radial-gradient(1px 1px at 50px 450px, #ddd, transparent), radial-gradient(2px 2px at 200px 350px, #fff, transparent),
    radial-gradient(1px 1px at 450px 600px, #eee, transparent), radial-gradient(2px 2px at 650px 400px, #fff, transparent);
  background-repeat: repeat;
  animation: moveStars linear infinite;
}

.layer-1 { background-size: 500px 500px; animation-duration: 60s; opacity: 1; }
.layer-2 { background-size: 800px 800px; animation-duration: 100s; opacity: 1.2; }
.layer-3 { background-size: 400px 400px; animation-duration: 150s; opacity: 1.5; }

@keyframes moveStars {
  from { transform: translateY(0); }
  to { transform: translateY(-100%); }
}

.controls { position: absolute; top: 30px; z-index: 100; }

button {
  padding: 12px 25px;
  border: 2px solid var(--gold);
  border-radius: 30px;
  background: rgba(0,0,0,0.6);
  color: var(--gold);
  font-family: 'Georgia', serif;
  font-size: 1em;
  cursor: pointer;
  transition: 0.3s;
  backdrop-filter: blur(5px);
}

button:hover { background: var(--gold); color: #000; transform: scale(1.05); }

.book-container {
  position: relative;
  width: 320px;
  height: 460px;
  transform-style: preserve-3d;
  cursor: pointer;
  transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1);
}

.book-container.open { transform: translateX(160px); }

.book {
  width: 100%;
  height: 100%;
  position: relative;
  transform-style: preserve-3d;
}

.page {
  position: absolute;
  width: 100%;
  height: 100%;
  top: 0;
  left: 0;
  transform-origin: left;
  transform-style: preserve-3d;
  border-radius: 4px 12px 12px 4px;
  background: var(--page-color);
  box-shadow: inset 15px 0 30px rgba(0,0,0,0.1), 2px 0 5px rgba(0,0,0,0.1);
  transition: transform 2s cubic-bezier(0.4, 0.0, 0.2, 1);
}

.inner-page {
  background-image:
    radial-gradient(rgba(0, 0, 0, 0.03) 1px, transparent 1px),
    radial-gradient(rgba(0, 0, 0, 0.03) 1px, transparent 1px);
  background-size: 10px 10px;
  background-position: 0 0, 5px 5px;
}

.front-cover {
  background: var(--book-color);
  z-index: 20;
  display: flex;
  justify-content: center;
  align-items: center;
  border: 5px solid var(--gold);
  transition: background-color 1s, transform 2s cubic-bezier(0.4, 0, 0.2, 1);
}

.cover-content {
  text-align: center;
  padding: 30px;
  border-radius: 10px;
  color: var(--gold);
  box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
}

.back-cover {
  background: var(--book-color);
  z-index: 0;
  transform: translateZ(-30px);
  box-shadow: 20px 20px 60px rgba(0,0,0,0.5);
  transition: background-color 1s;
}

.spine {
  position: absolute;
  top: 0;
  left: 0;
  width: 30px;
  height: 100%;
  background: #3e2723;
  transform: rotateY(-90deg) translateX(-15px);
  transform-origin: left;
}

#particleOrigin {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 1px;       /* antes era 0 */
    height: 1px;      /* antes era 0 */
    pointer-events: none;
}



.p1 { z-index: 15; }
.p2 { z-index: 14; }
.p3 { z-index: 13; display: flex; align-items: center; justify-content: center; text-align: center; padding: 20px; box-sizing: border-box; }


.book-container.open .front-cover {
  transform: rotateY(-180deg);
  transition-delay: 0s;
}

.book-container.open .p1 { transform: rotateY(-170deg); transition-delay: 0.3s; }
.book-container.open .p2 { transform: rotateY(-150deg); transition-delay: 0.3s; }
.book-container.open .p3 { transform: rotateY(-10deg); transition-delay: 0.3s; background: linear-gradient(to right, #ddd, var(--page-color) 10%); border-left: none; }

/* --- VENT --- */
.page.fly {
  position: absolute;
  transform-origin: center;
  animation: flyPage 3s ease-out forwards;
  z-index: 1000;
}

@keyframes flyPage {
  0% { transform: rotateY(0deg) rotateX(0deg) translate(0,0); opacity: 1; }
  25% { transform: rotateY(90deg) rotateX(20deg) translate(30px,-50px); opacity: 0.9; }
  50% { transform: rotateY(180deg) rotateX(60deg) translate(100px,-150px); opacity: 0.7; }
  75% { transform: rotateY(270deg) rotateX(120deg) translate(200px,-250px); opacity: 0.5; }
  100% { transform: rotateY(360deg) rotateX(180deg) translate(300px,-400px); opacity: 0; }
}

/* --- PARTICULES --- */
.particle {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
  z-index: 999;
  mix-blend-mode: screen;
  will-change: transform, opacity;
}

@keyframes floatUp {
  0% { opacity: 0; transform: translate(0, 0) scale(0); }
  10% { opacity: 1; transform: translate(var(--tx), -50px) scale(1); }
  100% { opacity: 0; transform: translate(var(--tx-end), -600px) scale(0); }
}


/* --- SECOUER--- */
@keyframes shakeOpen {
  0% { transform: translate(0,0) rotate(0deg); }
  25% { transform: translate(5px,-5px) rotate(-5deg); }
  50% { transform: translate(-5px,5px) rotate(5deg); }
  75% { transform: translate(5px,-5px) rotate(-5deg); }
  100% { transform: translate(0,0) rotate(0deg); }
}

.shake { 
    animation: shakeOpen 2s; 
}



/* --- FEU --- */
.fire-container {
    position: absolute;
    left: 50%;
    top: 40%;
    transform: translate(-50%, -40%);
    width: 250px;
    height: 350px;
    pointer-events: none;
    z-index: 9999;
}

/* FLAMMES INDIVIDUELLES */
.flame {
    position: absolute;
    bottom: 0;
    left: 50%;
    width: 120px;
    height: 220px;
    transform: translateX(-50%);
    border-radius: 50% 50% 20% 20%;
    background: radial-gradient(circle at 50% 20%,
        #fff9c4 0%,
        #ffd54f 40%,
        #ff6f00 70%,
        #d84315 90%
    );
    filter: blur(12px);
    animation: flameFlicker 0.7s infinite alternate ease-in-out;
    opacity: 0.95;
}

.flame.small {
    width: 90px;
    height: 170px;
    left: 30%;
    animation: flameFlicker 0.6s infinite alternate ease-in-out;
}

.flame.small2 {
    width: 100px;
    height: 190px;
    left: 70%;
    animation: flameFlicker 0.8s infinite alternate ease-in-out;
}

/* ANIMATION FLAMMES */
@keyframes flameFlicker {
    0%   { transform: translateX(-50%) scale(1,1); opacity: 0.8; }
    50%  { transform: translateX(-48%) scale(1.2,1.1); opacity: 0.9; }
    100% { transform: translateX(-52%) scale(1.4,1.3) translateY(-20px); opacity: 1; }
}

/* FUMÉE */
.smoke {
    position: absolute;
    bottom: 100px;
    left: 50%;
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: rgba(150,150,150,0.15);
    filter: blur(20px);
    transform: translateX(-50%);
    animation: smokeRise 3s linear infinite;
}

@keyframes smokeRise {
    0%   { transform: translate(-50%,0) scale(1); opacity: 0.3; }
    50%  { transform: translate(-50%,-50px) scale(1.5); opacity: 0.2; }
    100% { transform: translate(-50%,-120px) scale(2.2); opacity: 0; }
}

/* ÉTINCELLES */
.spark {
    position: absolute;
    width: 6px;
    height: 6px;
    background: #ffe066;
    border-radius: 50%;
    box-shadow: 0 0 10px #ffd700;
    animation: sparkRise 1.2s linear forwards;
}

@keyframes sparkRise {
    0%   { transform: translate(0,0) scale(1); opacity: 1; }
    50%  { transform: translate(20px,-80px) scale(0.6); opacity: 0.8; }
    100% { transform: translate(50px,-200px) scale(0.2); opacity: 0; }
}

/* LUMIÈRE */
.magic-light {
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(255,220,100,0.9) 0%, rgba(255,200,50,0.5) 50%, transparent 70%);
    border-radius: 50%;
    pointer-events: none;
    filter: blur(30px) brightness(3.5);
    z-index: 9999;
    animation: lightExpand 1s ease-out forwards;
}



@keyframes lightExpand {
    0% { transform: scale(0.2); opacity: 0.8; }
    60% { transform: scale(1.3); opacity: 1; }
    100% { transform: scale(2); opacity: 0; } /* estava faltando o fechamento */
}


/* --- ECRITURE --- */
.bouncing-letter {
    position: absolute;
    font-size: 24px;
    font-family: 'Georgia', serif;
    color: red;
    user-select: none;
    pointer-events: none;
    text-shadow: 0 0 8px var(--gold), 0 0 16px var(--gold);
    animation: bounce 3s infinite ease-in-out;
}

@keyframes bounce {
    0%   { transform: translate(0, 0) rotate(0deg); }
    25%  { transform: translate(20px, -30px) rotate(90deg); }
    50%  { transform: translate(-15px, 20px) rotate(180deg); }
    75%  { transform: translate(30px, -10px) rotate(270deg); }
    100% { transform: translate(0, 0) rotate(360deg); }
}


</style>

<script>

const bookContainer = document.getElementById('bookContainer');
const body = document.body;
let isOpen = false;
let particleInterval;
let magicTimeout;
let fireInterval = null;


// Cores mágicas para partículas
const colors = ['#ffd700', '#ff9a9e', '#a18cd1', '#ffffff', '#84fab0'];

// FUNÇÃO PARA TOCAR SOM
function playSound(audioId) {
    const audio = document.getElementById(audioId);
    if (audio) {
        audio.currentTime = 0;
        audio.play().catch(e => console.log("Erro de áudio: " + e));
    }
}


// FUNÇÃO PARA PARAR SOM
function stopSound(audioId) {
    const audio = document.getElementById(audioId);
    if (audio) {
        audio.pause();
        audio.currentTime = 0;
    }
}

// Alternar tema (dark/light)
function toggleTheme() {
    body.classList.toggle('dark-mode');
    body.style.transition = 'background 1.5s ease, color 1.5s ease';
    setTimeout(() => { body.style.transition = ''; }, 1600);
}

// Abrir/fechar livro
function toggleBook() {
    isOpen = !isOpen;

    if (isOpen) {
        bookContainer.classList.add('open');

        // Sons das páginas
        const pageTurnDelay = 200;
        setTimeout(() => playSound('soundPage'), 300);
        setTimeout(() => playSound('soundPage'), 300 + pageTurnDelay);
        setTimeout(() => playSound('soundPage'), 300 + 2 * pageTurnDelay);

        // NÃO iniciar partículas automaticamente!
        // magicTimeout = setTimeout(startMagic, 500); // removido
    } else { 
        bookContainer.classList.remove('open'); 
        clearTimeout(magicTimeout); 
        stopMagic(); 
        stopLumiere();
    }
 }
    
// BUTTON PARTICULES
function createParticle() {
    if (!isOpen) return; // só cria partículas se o livro estiver aberto

    const particle = document.createElement('div');
    particle.classList.add('particle');

    // tamanho aleatório
    const size = Math.random() * 12 + 4;
    particle.style.width = `${size}px`;
    particle.style.height = `${size}px`;

    // cores mágicas
    const currentColors = body.classList.contains('dark-mode')
        ? ['#ffffff', '#cfcfcf', '#a0a0ff', '#ffd700', '#e0e0ff']
        : colors;

    const color = currentColors[Math.floor(Math.random() * currentColors.length)];
    particle.style.background = color;
    particle.style.boxShadow = `0 0 ${size * 3}px ${color}`;

    // posição inicial: centro da lombada
   const origin = document.getElementById('particleOrigin').getBoundingClientRect();
   const startX = origin.left + origin.width / 2;
   const startY = origin.top + origin.height / 2;




    // trajetórias aleatórias
    const tx = (Math.random() - 0.5) * 120;
    const txEnd = (Math.random() - 0.5) * 700;
    particle.style.setProperty('--tx', `${tx}px`);
    particle.style.setProperty('--tx-end', `${txEnd}px`);

    // animação
    const duration = Math.random() * 2 + 2;
    particle.style.animation = `floatUp ${duration}s ease-out forwards`;

    // adiciona ao body
    document.body.appendChild(particle);

    // remove automaticamente após animação
    setTimeout(() => particle.remove(), duration * 1000);
}


let particlesActive = false;

function rainbowParticles() {
    if (!isOpen) return; // Só funciona se o livro estiver aberto

    if (!particlesActive) {
        startMagic();
        playSound("soundParticles"); 
        particlesActive = true;
    } else {
        stopMagic();
        stopSound("soundParticles");
        particlesActive = false;
    }
}

function startMagic() {
    stopMagic();
    for (let i = 0; i < 100; i++) setTimeout(createParticle, i * 15);
    particleInterval = setInterval(createParticle, 15);
}

function stopMagic() {
    if (particleInterval) clearInterval(particleInterval);
}

// BUTTON VENT
function flyPages() {
    if (!isOpen) return;

    const windSound = document.getElementById('soundWind');
    windSound.currentTime = 0;
    windSound.play().catch(e => console.log("Erro de áudio: " + e));
    
    const pages = document.querySelectorAll('.page:not(.front-cover):not(.back-cover)');
    const repeat = 10; // cada página vai se repetir 10 vezes
    const totalClones = pages.length * repeat;
  

    for (let i = 0; i < totalClones; i++) {
        setTimeout(() => {
            const page = pages[i % pages.length]; // pega página original ou repete
            const flyingPage = page.cloneNode(true);
            const rect = page.getBoundingClientRect();

            flyingPage.style.position = 'absolute';
            flyingPage.style.left = `${rect.left}px`;
            flyingPage.style.top = `${rect.top}px`;
            flyingPage.style.width = `${rect.width}px`;
            flyingPage.style.height = `${rect.height}px`;
            flyingPage.style.zIndex = 1000;
            flyingPage.style.pointerEvents = 'none';
            flyingPage.style.transition = 'transform 6s ease-out, opacity 6s ease-out';

            document.body.appendChild(flyingPage);

            // Trajetória aleatória
            const endX = (Math.random() - 0.5) * window.innerWidth * 2;
            const endY = (Math.random() - 0.5) * window.innerHeight * 2;
            const rotateX = (Math.random() - 0.5) * 1080;
            const rotateY = (Math.random() - 0.5) * 1080;

            requestAnimationFrame(() => {
                flyingPage.style.transform = `translate(${endX}px, ${endY}px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
                flyingPage.style.opacity = 0;
            });

            // Remove o clone após 4s
            setTimeout(() => flyingPage.remove(), 4000);
        }, i * 100); // pequenas diferenças de tempo
    }
    
     // Para o som após todas as páginas terminarem
    setTimeout(() => {
        windSound.pause();
        windSound.currentTime = 0;
    }, 4000 + totalClones * 50);
}


// BUTTON SECOUER
function shakeBook() {
    if (!isOpen) {
        toggleBook(); // abre o livro

        // espera 1.2s até a animação do livro abrir
        setTimeout(() => {
            bookContainer.classList.add('shake');

            // toca o som no início
            playSound("soundShake");

            // remove shake e para o som após 0.5s
            setTimeout(() => {
                bookContainer.classList.remove('shake');
                stopSound("soundShake");
            }, 500);

        }, 1200);
    } else {
        // se já estiver aberto
        bookContainer.classList.add('shake');

        // toca o som no início
        playSound("soundShake");

        // remove shake e para o som após 0.5s
        setTimeout(() => {
            bookContainer.classList.remove('shake');
            stopSound("soundShake");
        }, 2000);
    }
}





// BUTTON LUMIERE
let lumiereActive = false;
let lumiereInterval = null;

function createMagicLight() {
    if (!isOpen) return;

    const light = document.createElement('div');
    light.classList.add('magic-light');

    // Pega o centro do livro na viewport
    const bookRect = document.getElementById('bookContainer').getBoundingClientRect();
    const lightWidth = 300; // largura da luz
    const lightHeight = 300; // altura da luz
    const x = bookRect.left + bookRect.width / 2 - lightWidth / 2 - 80; // desloca 80px para a esquerda
    const y = bookRect.top + bookRect.height / 2 - lightHeight / 2; // central vertical
   

    document.body.appendChild(light);
    light.style.left = `${x}px`;
    light.style.top = `${y}px`;
    light.style.position = 'fixed';
    light.style.zIndex = 9999;
    light.style.transform = 'none';

    // Remove a luz após a animação
    setTimeout(() => light.remove(), 1000);
}

function toggleLumiere() {
    if (!isOpen) return;

    const audio = document.getElementById("soundLumiere");

    if (!lumiereActive) {
        // Toca o som
        if (audio) {
            audio.currentTime = 0;
            audio.play().catch(e => console.log("Erro de áudio: " + e));
        }

        // Cria luz continuamente
        lumiereInterval = setInterval(createMagicLight, 200);
        lumiereActive = true;
    } else {
        // Para o som
        if (audio) {
            audio.pause();
            audio.currentTime = 0;
        }

        // Para a criação da luz e remove as existentes
        clearInterval(lumiereInterval);
        lumiereInterval = null;
        document.querySelectorAll('.magic-light').forEach(el => el.remove());

        lumiereActive = false;
    }
}



// BUTTON FEU
function spawnFire() {
    const flameBox = document.createElement("div");
    flameBox.style.position = "absolute";
    flameBox.style.left = "50%";
    flameBox.style.top = "50%";
    flameBox.style.width = "50px";
    flameBox.style.height = "50px";
    flameBox.style.background = "red";
    flameBox.style.zIndex = 9999;
    flameBox.style.transform = "translate(-50%, -50%)";
    document.body.appendChild(flameBox);
}

let fireActive = false;
let fireBox = null;
let sparkLoop = null;

function toggleFire() {
    if (!isOpen) return;

    if (fireActive) {
        stopFire();
    } else {
        startFire();
    }
    fireActive = !fireActive;
}

function startFire() {
    stopFire();

    fireBox = document.createElement("div");
    fireBox.classList.add("fire-container");

    // Flammes principales et secondaires
    const f1 = document.createElement("div");
    f1.classList.add("flame");

    const f2 = document.createElement("div");
    f2.classList.add("flame", "small");

    const f3 = document.createElement("div");
    f3.classList.add("flame", "small2");

    // Fumée
    const smoke = document.createElement("div");
    smoke.classList.add("smoke");

    fireBox.appendChild(f1);
    fireBox.appendChild(f2);
    fireBox.appendChild(f3);
    fireBox.appendChild(smoke);

    document.body.appendChild(fireBox);

    playSound("soundFire");

}

function stopFire() {
    if (fireBox) {
        fireBox.remove();
        fireBox = null;
    }
    if (sparkLoop) {
        clearInterval(sparkLoop);
        sparkLoop = null;
    }
    
    stopSound("soundFire");
}

function spawnSpark() {
    if (!fireBox) return;

    const s = document.createElement("div");
    s.classList.add("spark");

    s.style.left = (50 + (Math.random() * 20 - 10)) + "%";
    s.style.bottom = "40px";

    fireBox.appendChild(s);

    setTimeout(() => s.remove(), 1200);
}


// BUTTON ECRITURE
const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
let writingActive = false;
let writingInterval = null;

function startWriting() {
    if (!isOpen) toggleBook(); // abre o livro se estiver fechado

    if (writingActive) {
        stopWriting();
        return;
    }

    writingActive = true;
    playSound("soundWriting");

    writingInterval = setInterval(() => {
        const bookRect = document.getElementById('bookContainer').getBoundingClientRect();
        const letter = document.createElement('div');
        letter.classList.add('bouncing-letter');

        // letra aleatória
        letter.textContent = letters.charAt(Math.floor(Math.random() * letters.length));

        const colors = ['red','blue','green','yellow','pink'];
        letter.style.color = colors[Math.floor(Math.random() * colors.length)];

        // posição inicial dentro do livro
        const x = bookRect.left + Math.random() * bookRect.width;
        const y = bookRect.top + Math.random() * bookRect.height;
        letter.style.left = `${x}px`;
        letter.style.top = `${y}px`;
        letter.style.position = 'absolute';

        // animação inicial aleatória
        const scale = 0.5 + Math.random();
        letter.style.transform = `scale(${scale}) rotate(${Math.random() * 360}deg)`;

        document.body.appendChild(letter);

        // remove após 5s
        setTimeout(() => letter.remove(), 10000);
    }, 100); // cria várias letras por segundo
}

function stopWriting() {
    writingActive = false;
    if (writingInterval) clearInterval(writingInterval);
    writingInterval = null;

    // remove todas as letras existentes
    document.querySelectorAll('.bouncing-letter').forEach(el => el.remove());

    stopSound("soundWriting");
}




function resetBook() {
    // Fecha o livro
    isOpen = false;
    bookContainer.classList.remove('open');

    // DESATIVAR SEMPRE o dark mode
    if (document.body.classList.contains('dark-mode')) {
        document.body.classList.remove('dark-mode');
    }

    // Para partículas mágicas
    if (typeof stopMagic === "function") stopMagic();

    // Para fogo
    if (typeof stopFire === "function") stopFire();

    // Para Lumière
    if (typeof stopLumiere === "function") stopLumiere();

    // Para  Écriture
    if (typeof stopWriting === "function") stopWriting();
    

    // Remove TODAS as partículas do ecrã
    document.querySelectorAll('.particle, .fire, .magic.beam').forEach(el => el.remove());   
 }


</script>
