<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Grimoire Magique Interactif</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="stars-container">
        <div class="stars-layer layer-1"></div>
        <div class="stars-layer layer-2"></div>
        <div class="stars-layer layer-3"></div>
    </div>

    <div class="library-bg"></div>

    <audio id="soundPage" src="page.mp3" preload="auto"></audio>

    <div class="controls">
        <button id="themeBtn" onclick="toggleTheme()">Changer d'ambiance</button>
    </div>

    <div class="book-container" id="bookContainer" onclick="toggleBook()">
        <div class="book">
            <div class="page back-cover"></div>
            <div class="spine"></div>

            <div class="page inner-page p3">
                <div class="page-content">
                    <p>...et la magie commence</p>
                </div>
            </div>
            <div class="page inner-page p2"></div>
            <div class="page inner-page p1"></div>

            <div class="page front-cover">
                <div class="cover-content">
                    <h1>Le Grimoire</h1>
                    <div class="ornament"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>


<style>

  /* --- VARIABLES --- */
:root {
    /* Mode Bibliothèque (Par défaut) */
    --bg-radial-center: #8e5e48;
    --bg-radial-edge: #2c1810;
    --book-color: #5d2e22;
    --gold: #f5deb3;
    --page-color: #f5deb3;
    --text-color: #f5deb3;
    --star-opacity: 0;
    --library-opacity: 1;
}

body.dark-mode {
    /* Mode Nuit Étoilée */
    --bg-radial-center: #1a1a2e;
    --bg-radial-edge: #000000;
    --book-color: #1a237e;
    --gold: #d2b48c;
    --page-color: #d2b48c;
    --text-color: #000;
    --star-opacity: 1;
    --library-opacity: 0;
}

/* --- CONFIGURATION GENERALE --- */
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #000;
    font-family: 'Georgia', serif;
    overflow: hidden;
    perspective: 2000px;
}

/* FOND BIBLIOTHEQUE (Simulé par dégradé) */
.library-bg {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at center, var(--bg-radial-center), var(--bg-radial-edge));
    opacity: var(--library-opacity);
    transition: opacity 1.5s ease;
    z-index: -2;
}

/* FOND ETOILÉ */
.stars-container {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: -1;
    opacity: var(--star-opacity);
    transition: opacity 1.5s ease;
}
.stars-layer {
    position: absolute; inset: 0;
    /* Grande densité d'étoiles aléatoires */
    background-image: 
        radial-gradient(1px 1px at 10px 10px, #fff, transparent), radial-gradient(1px 1px at 50px 80px, #fff, transparent),
        radial-gradient(2px 2px at 120px 30px, #eee, transparent), radial-gradient(2px 2px at 180px 150px, #fff, transparent),
        radial-gradient(1px 1px at 250px 90px, #ddd, transparent), radial-gradient(1px 1px at 300px 200px, #fff, transparent),
        radial-gradient(2px 2px at 400px 150px, #eee, transparent), radial-gradient(1px 1px at 500px 250px, #fff, transparent),
        radial-gradient(2px 2px at 600px 100px, #ddd, transparent), radial-gradient(1px 1px at 700px 300px, #fff, transparent),
        radial-gradient(1px 1px at 800px 50px, #eee, transparent), radial-gradient(2px 2px at 900px 220px, #fff, transparent),
        radial-gradient(1px 1px at 50px 450px, #ddd, transparent), radial-gradient(2px 2px at 200px 350px, #fff, transparent),
        radial-gradient(1px 1px at 450px 600px, #eee, transparent), radial-gradient(2px 2px at 650px 400px, #fff, transparent);
        
    background-repeat: repeat;
    animation: moveStars linear infinite;
}
.layer-1 { 
    background-size: 500px 500px; 
    animation-duration: 60s; 
    opacity: 0.5; 
}
.layer-2 { 
    background-size: 800px 800px; 
    animation-duration: 100s; 
    opacity: 0.7; 
}
.layer-3 { 
    background-size: 400px 400px;
    animation-duration: 150s; 
    opacity: 1; 
}

@keyframes moveStars { 
    from { transform: translateY(0); } 
    to { transform: translateY(-100%); } 
}

/* --- BOUTON --- */
.controls { position: absolute; top: 30px; z-index: 100; }
button {
    padding: 12px 25px; border: 2px solid var(--gold); border-radius: 30px;
    background: rgba(0,0,0,0.6); color: var(--gold);
    font-family: 'Georgia', serif; font-size: 1em; cursor: pointer;
    transition: 0.3s; backdrop-filter: blur(5px);
}
button:hover { background: var(--gold); color: #000; transform: scale(1.05); }

/* --- LE LIVRE --- */
.book-container {
    position: relative; width: 320px; height: 460px;
    transform-style: preserve-3d; cursor: pointer;
    transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1);
}
.book-container.open { transform: translateX(160px); }

.book {
    width: 100%; height: 100%; position: relative;
    transform-style: preserve-3d;
}

/* --- PAGES ET EFFET VIEILLI --- */
.page {
    position: absolute; width: 100%; height: 100%; top: 0; left: 0;
    transform-origin: left; transform-style: preserve-3d;
    border-radius: 4px 12px 12px 4px;
    background: var(--page-color);
    box-shadow: inset 15px 0 30px rgba(0,0,0,0.1), 2px 0 5px rgba(0,0,0,0.1);
    transition: transform 2s cubic-bezier(0.4, 0.0, 0.2, 1);
}
.inner-page {
    background-image: 
        radial-gradient(rgba(0, 0, 0, 0.03) 1px, transparent 1px),
        radial-gradient(rgba(0, 0, 0, 0.03) 1px, transparent 1px);
    background-size: 10px 10px;
    background-position: 0 0, 5px 5px;
}

/* Couverture Avant - Contient la bordure sur les bords extérieurs */
.front-cover {
    background: var(--book-color); 
    z-index: 20;
    display: flex; 
    justify-content: center; 
    align-items: center;
    
    /* BORDURE D'ORNEMENT SUR LE BORD EXTÉRIEUR */
    border: 5px solid var(--gold); 
    
    /* Maintient la transition */
    transition: background-color 1s, transform 2s cubic-bezier(0.4, 0, 0.2, 1);
}

.cover-content {
    text-align: center; 
    padding: 30px; 
    border-radius: 10px; 
    color: var(--gold);
    box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
}

/* Dos du livre */
.back-cover {
    background: var(--book-color); z-index: 0;
    transform: translateZ(-30px);
    box-shadow: 20px 20px 60px rgba(0,0,0,0.5);
    transition: background-color 1s;
}
.spine {
    position: absolute; top: 0; left: 0; width: 30px; height: 100%;
    background: #3e2723;
    transform: rotateY(-90deg) translateX(-15px);
    transform-origin: left;
}

/* Z-index initial */
.p1 { z-index: 15; }
.p2 { z-index: 14; }
.p3 { z-index: 13; display: flex; align-items: center; justify-content: center; text-align: center; padding: 20px; box-sizing: border-box;}

/* --- SEQUENCE D'OUVERTURE (Effet Vent) --- */

/* 🔥 CORRECTION DU PROBLÈME DE DISPARITION : La couverture tourne sans délai pour masquer immédiatement les pages 🔥 */
.book-container.open .front-cover { 
    transform: rotateY(-180deg); 
    transition-delay: 0s; 
}

/* Les pages tournent avec un DÉLAI pour simuler le feuilletage après la couverture */
.book-container.open .p1 { transform: rotateY(-170deg); transition-delay: 0.1s; } 
.book-container.open .p2 { transform: rotateY(-160deg); transition-delay: 0.3s; }
.book-container.open .p3 { transform: rotateY(-10deg); transition-delay: 0.5s; background: linear-gradient(to right, #ddd, var(--page-color) 10%); border-left: none;}

/* --- PARTICULES --- */
.particle {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    z-index: 999;
    mix-blend-mode: screen;
    will-change: transform, opacity;
}

@keyframes floatUp {
    0% { opacity: 0; transform: translate(0, 0) scale(0); }
    10% { opacity: 1; transform: translate(var(--tx), -50px) scale(1); }
    100% { opacity: 0; transform: translate(var(--tx-end), -600px) scale(0); }
}
  
</style>

<script> 
  const bookContainer = document.getElementById('bookContainer');
const body = document.body;
let isOpen = false;
let particleInterval;
let magicTimeout;

// Couleurs magiques (Or, Violet, Bleu, Blanc)
const colors = ['#ffd700', '#ff9a9e', '#a18cd1', '#ffffff', '#84fab0'];

// ===============================================
// FONCTION POUR JOUER UN SON
// ===============================================
function playSound(audioId) {
    const audio = document.getElementById(audioId);
    if (audio) {
        audio.currentTime = 0; // Rembobine si déjà en cours de lecture
        audio.play().catch(e => console.log("Erreur de lecture audio : " + e));
    }
}
// ===============================================

function toggleTheme() {
    body.classList.toggle('dark-mode');
    // Si vous avez un son pour le thème
    // playSound('soundTheme'); 
}

function toggleBook() {
    isOpen = !isOpen;
    
    // Si vous avez un son pour l'ouverture du livre
    // playSound('soundBook'); 

    if (isOpen) {
        bookContainer.classList.add('open');
        
        // ===============================================
        // DÉCLENCHEMENT DES SONS DE PAGE AU FEUILLETAGE
        // ===============================================
        const pageTurnDelay = 200; // Délai en ms entre chaque son de page
        
        // Page 1 (démarrage à 300ms après le clic)
        setTimeout(() => { playSound('soundPage'); }, 300); 
        
        // Page 2
        setTimeout(() => { playSound('soundPage'); }, 300 + pageTurnDelay); 
        
        // Page 3
        setTimeout(() => { playSound('soundPage'); }, 300 + (2 * pageTurnDelay)); 
        // ===============================================

        // Lancement de la magie après que toutes les pages sont tournées
        magicTimeout = setTimeout(startMagic, 2200); 
        
    } else {
        bookContainer.classList.remove('open');
        clearTimeout(magicTimeout);
        stopMagic();
    }
}

// Créer une particule
function createParticle() {
    // Sécurité : Si le livre n'est plus ouvert, on arrête
    if (!isOpen) return;

    const particle = document.createElement('div');
    particle.classList.add('particle');
    
    // Taille aléatoire (petite et grande)
    const size = Math.random() * 8 + 3; 
    particle.style.width = `${size}px`;
    particle.style.height = `${size}px`;
    
    // Couleur aléatoire + Glow
    const color = colors[Math.floor(Math.random() * colors.length)];
    particle.style.background = color;
    particle.style.boxShadow = `0 0 ${size * 2}px ${color}`;

    // POSITIONNEMENT CRITIQUE
    const rect = bookContainer.getBoundingClientRect();
    const startX = rect.left; 
    const startY = rect.top + rect.height / 2 + (Math.random() * 150 - 75); 
    
    particle.style.left = `${startX}px`;
    particle.style.top = `${startY}px`;

    // Définition des trajectoires (Variables CSS pour l'animation)
    const tx = (Math.random() - 0.5) * 50; 
    const txEnd = (Math.random() - 0.5) * 400; 
    
    particle.style.setProperty('--tx', `${tx}px`);
    particle.style.setProperty('--tx-end', `${txEnd}px`);

    // Vitesse
    const duration = Math.random() * 2 + 2; 
    particle.style.animation = `floatUp ${duration}s ease-out forwards`;

    document.body.appendChild(particle);

    // Nettoyage du DOM
    setTimeout(() => {
        particle.remove();
    }, duration * 1000);
}

function startMagic() {
    stopMagic();
    
    // Si vous avez un son pour la magie
    // playSound('soundMagic');
    
    // Explosion initiale
    for(let i=0; i<20; i++) setTimeout(createParticle, i * 50);
    // Flux continu
    particleInterval = setInterval(createParticle, 50);
}

function stopMagic() {
    if (particleInterval) clearInterval(particleInterval);
}
   
</script>

  
</body>
</html>
